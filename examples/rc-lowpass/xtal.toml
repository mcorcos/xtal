[project]
name = "rc-lowpass"
authors = ["Manuel Corcos"]
theme = "itba"

[document]
format = "facultad"
title = "Filtro pasabajos RC de primer orden"
subtitle = "Teoría, simulación y medición"
course = "Ejemplo de Xtal"

[[sections]]
title = "Objetivo"
body = '''
Se caracteriza un filtro pasabajos RC de primer orden ($R = 1{,}6\,\mathrm{k}\Omega$, $C = 100\,\mathrm{nF}$), contrastando tres fuentes de datos: la respuesta \textbf{teórica} obtenida del modelo analítico, la \textbf{simulada} con ngspice y la \textbf{medida} sobre el circuito armado.

La frecuencia de corte nominal es
\[ f_c = \frac{1}{2\pi RC} = \frac{1}{2\pi \cdot 1600 \cdot 100\times10^{-9}} \approx 994{,}7\ \mathrm{Hz}. \]'''
subsections = []
figures = []

[[sections]]
title = "Modelo teórico"
body = '''
La transferencia del filtro es
\[ H(j\omega) = \frac{1}{1 + j\,\omega RC} \qquad\Longrightarrow\qquad |H|_{\mathrm{dB}} = -10\log_{10}\!\left(1 + \left(\tfrac{f}{f_c}\right)^{2}\right), \quad \varphi = -\arctan\!\left(\tfrac{f}{f_c}\right). \]
En $f_c$ la atenuación vale $-3{,}01$ dB y la fase $-45^\circ$; por encima, la caída es de $-20$ dB por década.'''
subsections = []
figures = []

[[sections]]
title = "Respuesta en frecuencia"
body = "La Figura compara las tres fuentes en magnitud y fase. Las tres curvas se superponen dentro del error de medición. El leve corrimiento de la curva medida respecto de la teórica se explica por la tolerancia de los componentes reales."
subsections = []
figures = ["bode"]

[[sections]]
title = "Respuesta temporal"
body = 'Excitando con una senoidal de $1\,\mathrm{kHz}$ (frecuencia cercana a $f_c$) se observa la atenuación a aproximadamente $0{,}7$ veces la amplitud de entrada y el retardo de fase de unos $-45^\circ$ característicos del corte.'
subsections = []
figures = ["transitorio"]
