# Release de Xtal: compila el binario para cada plataforma, arma los tarballs y
# publica la GitHub Release.
#
# Se dispara al pushear un tag `vX.Y.Z`. El flujo completo es:
#
#   1. `check`  — el tag y la version de Cargo.toml tienen que coincidir.
#   2. `assets` — genera los completions y las man pages UNA vez. No dependen de la
#                 plataforma, y generarlos acá evita tener que ejecutar un binario
#                 cross-compilado (ver el job `build`).
#   3. `build`  — matriz de 4 targets. Cada job produce
#                 `xtal-<version>-<target>.tar.gz` con el binario, los assets y la doc.
#   4. `release`— junta todos los tarballs, calcula SHA256SUMS y crea la Release.
#
# El paquete de Homebrew NO se actualiza desde acá: el repo del tap
# (mcorcos/homebrew-xtal) mira esta Release por su cuenta y regenera su fórmula. Así no
# hace falta guardar un token con permiso de escritura sobre otro repo en los secrets de
# este. Ver docs/RELEASING.md.
#
# Todo lo que el instalador `install.sh` espera encontrar (nombres de los assets y el
# archivo SHA256SUMS) se define acá: si cambia un nombre, hay que cambiarlo en los dos lados.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Permite ensayar el build sin publicar nada (útil para probar la matriz).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compilar y empaquetar sin crear la Release"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # necesario para crear la Release y subir los assets

jobs:
  # ---------------------------------------------------------------------------
  # 1. Coherencia entre el tag y la version del workspace
  # ---------------------------------------------------------------------------
  check:
    name: verificar version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        name: Extraer y comparar versiones
        run: |
          set -euo pipefail
          # En workflow_dispatch no hay tag: usamos la version de Cargo.toml tal cual.
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"

          # La app de escritorio tiene su propio Cargo.toml (es otro workspace) y su
          # propio package.json y tauri.conf.json. Los tres tienen que decir lo mismo:
          # si no, el instalador de Windows sale con una version distinta a la del
          # binario que trae adentro, y `xtal update` compara contra la equivocada.
          for archivo in \
            "app-win/src-tauri/Cargo.toml:^version" \
            "app-win/src-tauri/tauri.conf.json:\"version\"" \
            "app-win/package.json:\"version\""
          do
            f="${archivo%%:*}"; patron="${archivo##*:}"
            v="$(grep -m1 "$patron" "$f" | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
            if [ "$v" != "$CARGO_VERSION" ]; then
              echo "::error::$f dice $v pero el workspace dice $CARGO_VERSION. Sincronizalos."
              exit 1
            fi
          done

          # La app de Mac no es otro workspace de Rust: es un proyecto de Xcode, y su
          # version vive en un .xcconfig, sin comillas. Por eso va aparte del loop de
          # arriba, que espera un valor entrecomillado.
          APP_MAC="$(grep -m1 '^MARKETING_VERSION' app/Config/Shared.xcconfig \
                     | sed -E 's/.*= *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ "$APP_MAC" != "$CARGO_VERSION" ]; then
            echo "::error::app/Config/Shared.xcconfig dice $APP_MAC pero el workspace dice $CARGO_VERSION. Sincronizalos."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::El tag es v$TAG_VERSION pero Cargo.toml dice $CARGO_VERSION. Sincronizalos antes de taggear."
              exit 1
            fi
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 2. Completions y man pages, una sola vez
  # ---------------------------------------------------------------------------
  # Los genera el binario a partir de su propia definición de comandos, así que son
  # idénticos en las cuatro plataformas. Hacerlos acá, en un build nativo, evita que
  # los jobs de `build` tengan que EJECUTAR el binario que acaban de compilar: el de
  # Mac Intel se cross-compila desde un runner ARM y no se puede correr ahí.
  assets:
    name: completions + man page
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2

      - name: Generar
        run: |
          set -euo pipefail
          # Build de debug a propósito: es más rápido y el output es el mismo.
          cargo build --bin xtal
          mkdir -p assets/completions assets/man
          target/debug/xtal completions zsh  --out assets/completions
          target/debug/xtal completions bash --out assets/completions
          target/debug/xtal completions fish --out assets/completions
          target/debug/xtal man --out assets/man

      - uses: actions/upload-artifact@v5
        with:
          name: docs-assets
          path: assets
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Compilar y empaquetar, un job por plataforma
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.target }}
    needs: [check, assets]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Macs con Apple Silicon (M1 en adelante) — el caso principal de Manu.
          - target: aarch64-apple-darwin
            os: macos-14
          # Macs Intel. Se CROSS-COMPILA desde el runner ARM: los runners `macos-13`
          # fueron retirados por GitHub y un job que los pida queda encolado para
          # siempre. El clang de Apple compila x86_64 desde arm64 sin configurar nada,
          # así que alcanza con pedirle el target a rustup.
          - target: x86_64-apple-darwin
            os: macos-14
          # Linux x86_64. Runner viejo a propósito: linkea contra una glibc vieja,
          # así el binario anda también en distros no tan nuevas.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Linux ARM (runner nativo, gratis en repos publicos: no hace falta cross).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Windows x86_64. Toolchain MSVC, que es el default de Rust en Windows y el
          # que el resto del sistema espera (el de `-gnu` linkea contra mingw y necesita
          # sus DLLs al lado). Va empaquetado en **zip** y no en tar.gz: `tar` existe en
          # Windows 10 desde 2018, pero el doble click que todo el mundo hace es el del
          # Explorador, y el Explorador abre zip.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zip: true
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compilar en modo release
        run: cargo build --release --bin xtal --target ${{ matrix.target }}

      - name: Bajar los completions y la man page
        uses: actions/download-artifact@v5
        with:
          name: docs-assets
          path: assets

      - name: Armar el paquete
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          TARGET="${{ matrix.target }}"
          NAME="xtal-${VERSION}-${TARGET}"
          EXE=""
          if [ "${{ matrix.zip }}" = "true" ]; then EXE=".exe"; fi
          BIN="target/${TARGET}/release/xtal${EXE}"

          # El paquete se descomprime en una carpeta con su propio nombre (nunca
          # desparrama archivos en el cwd del usuario).
          mkdir -p "dist/${NAME}"
          cp "$BIN" "dist/${NAME}/xtal${EXE}"
          cp README.md LICENSE SKILL.md "dist/${NAME}/"
          # Los completions y la man page vienen del job `assets`, generados por el
          # binario a partir de la misma definición de comandos que los flags reales.
          cp -R assets/completions assets/man "dist/${NAME}/"

          if [ "${{ matrix.zip }}" = "true" ]; then
            # `powershell Compress-Archive` en vez de `zip`: el runner de Windows no
            # trae `zip`, y bash ahí es el de Git for Windows, que tampoco.
            powershell -NoProfile -Command \
              "Compress-Archive -Path 'dist/${NAME}' -DestinationPath 'dist/${NAME}.zip'"
          else
            tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Subir el paquete como artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3b. La app de escritorio para Windows
  # ---------------------------------------------------------------------------
  #
  # Se compila SOLO en Windows. Tauri no cross-compila: el instalador NSIS y el MSI los
  # arma con herramientas de Windows, y el webview contra el que linkea es WebView2, que
  # solo existe ahí. Esta es la razón de que el job viva acá y no en la matriz de arriba.
  #
  # El binario `xtal` NO va adentro del instalador. La app le habla al `xtal` instalado
  # en la máquina y **lo busca en las rutas donde queda** (ver `xtal_cli.rs` de la app).
  # Meterlo adentro daría dos copias con versiones que se separan solas, y ninguna de las
  # dos sería la que el usuario corre en la terminal.
  app:
    name: app de escritorio (Windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          # Los dos workspaces: el de la CLI (la raíz) y el de la app. Este job compila
          # los dos.
          workspaces: |
            .
            app-win/src-tauri
          key: app-windows

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-win/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: app-win
        run: npm ci

      # El binario de la CLI viaja ADENTRO del instalador de la app.
      #
      # Sin esto, bajar el `.exe` y abrirlo deja una app que no puede hacer nada: le
      # habla al comando `xtal`, y si no está instalado no compila, no simula y no lee un
      # proyecto. «Bajá el instalador y además abrí PowerShell y pegá un comando» no es
      # un instalador.
      #
      # No hay riesgo de dos copias desincronizadas: la app **prefiere la que esté
      # instalada en el sistema** y solo cae a esta si no hay ninguna. Ver el comentario
      # de `bundled()` en `app-win/src-tauri/src/xtal_cli.rs`.
      - name: Compilar la CLI y meterla adentro de la app
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin xtal
          cp target/release/xtal.exe app-win/src-tauri/resources/xtal.exe
          ls -la app-win/src-tauri/resources/

      # El motor del autocomplete, por el mismo argumento que el binario de arriba.
      #
      # En Mac el modelo lo corre MLX, que va compilado adentro de la app. En Windows lo
      # corre `llama-server`, que es un programa aparte: sin él, prender el autocomplete
      # falla con «no encontré llama-server», que no es algo que el usuario pueda
      # resolver. Son 18 MB — a diferencia del modelo, eso sí entra en un instalador.
      #
      # **La version va clavada**, como la de Tectonic en el job del PDF: llama.cpp
      # publica varias veces por día, y un instalador que trae algo distinto cada vez que
      # se compila es un instalador que no se puede depurar.
      #
      # **El build `cpu-x64` y no uno de GPU**: los de CUDA pesan 250 MB y solo sirven con
      # una placa NVIDIA. Para un modelo de 1.5B completando una línea, la CPU alcanza.
      - name: Meter llama-server adentro de la app
        shell: bash
        env:
          LLAMA_BUILD: b10647
        run: |
          set -euo pipefail
          url="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-win-cpu-x64.zip"
          curl -fsSL "$url" -o llama.zip
          unzip -o -j llama.zip -d llama-tmp
          # Van el server y las DLLs que carga: `llama-server.exe` solo no arranca.
          cp llama-tmp/llama-server.exe app-win/src-tauri/resources/
          cp llama-tmp/*.dll app-win/src-tauri/resources/ 2>/dev/null || true
          ls -la app-win/src-tauri/resources/

      - name: Compilar la app y armar el instalador
        working-directory: app-win
        # `tauri build` corre `npm run build` por su cuenta (lo dice `beforeBuildCommand`)
        # y después arma los dos formatos que declara `tauri.conf.json`: el `.exe` de
        # NSIS y el `.msi`. Los dos instalan **por usuario**, sin pedir administrador:
        # un TP de facultad no puede depender de tener permisos en la máquina.
        run: npm run tauri build

      - name: Juntar los instaladores con un nombre estable
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          OUT=app-win/src-tauri/target/release/bundle
          mkdir -p dist
          # Tauri los nombra `Xtal_0.3.1_x64-setup.exe` y `Xtal_0.3.1_x64_en-US.msi`.
          # Se renombran al esquema del resto de los assets para que `install.ps1` y la
          # página de la Release puedan armar la URL sin adivinar el idioma del MSI.
          cp "$OUT"/nsis/*-setup.exe "dist/Xtal-${VERSION}-windows-x64-setup.exe"
          cp "$OUT"/msi/*.msi        "dist/Xtal-${VERSION}-windows-x64.msi"
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: xtal-app-windows
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  app-mac:
    name: app de escritorio (macOS)
    needs: check
    # `macos-14` y posteriores son runners ARM. El build es **universal** igual
    # (`ARCHS = arm64 x86_64`): el xcframework de libghostty trae la slice
    # `macos-arm64_x86_64`, así que una sola app anda en Apple Silicon y en Intel y no
    # hay que publicar dos zips ni que el cask adivine cuál bajar.
    #
    # **`macos-26` y no `macos-15`, y esto NO es cosmético.** El Xcode más nuevo de
    # `macos-15` es el 26.3, y el 26.3 **crashea** armando el grafo de paquetes de este
    # proyecto:
    #
    #     INTERNAL ERROR: Uncaught exception
    #     -[NSMutableArray insertObjects:atIndexes:]: count of array (15) differs
    #     from count of index set (14)
    #     … IDESPMWorkspaceDelegate.registerDependencyFileReferences
    #
    # Es un bug de Xcode, no del proyecto: el stack es todo suyo y no menciona nada
    # nuestro. Apareció al pasar de 14 a 15 paquetes, que fue cuando entraron
    # `mlx-swift-lm` y `swift-transformers` para el autocomplete. `macos-26` trae Xcode
    # 26.6, donde no pasa — es el mismo con el que la app compila a mano en una Mac.
    #
    # Si algún día hay que volver a `macos-15`, el síntoma es ese `Abort trap: 6` con
    # exit 134, y lo primero que hay que mirar es la version de Xcode del runner.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Elegir Xcode
        # El runner trae varios y el `/Applications/Xcode.app` de default no siempre es
        # el más nuevo. El paquete pide swift-tools-version 6.1 (Xcode 16.3+), así que
        # se elige el mayor que haya en vez de clavar una ruta: una imagen nueva del
        # runner no rompe el release, y una vieja falla con un error que se entiende.
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Uso $XC"
          sudo xcode-select -switch "$XC"
          xcodebuild -version
          # **La Metal Toolchain no viene con Xcode 26**: es un componente aparte. Sin
          # ella, compilar `mlx-swift` —que trae sus propios shaders— falla con «cannot
          # execute tool 'metal'», que no dice que falta un componente descargable.
          # Es lo que hace el autocomplete, así que sin esto no hay app.
          xcodebuild -downloadComponent MetalToolchain

      - name: Cachear los paquetes de SwiftPM
        uses: actions/cache@v4
        with:
          # **La ruta es `app/build/SourcePackages`, no la DerivedData del sistema.**
          # El build corre con `-derivedDataPath build` desde `app/`, así que los paquetes
          # bajados van ahí. Apuntando a `~/Library/Developer/Xcode/DerivedData` esto no
          # cacheaba nada: se veía como un paso verde que no hacía su trabajo.
          #
          # Lo que ahorra: el xcframework de libghostty, que se baja por HTTP, y ahora
          # también `mlx-swift`, que es grande.
          path: app/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('app/XtalPackage/Package.resolved', 'app/Xtal.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          # Sin `restore-keys`: una caché de paquetes que no corresponde al
          # `Package.resolved` de hoy es peor que no tener caché.

      # Resolver los paquetes ANTES de compilar, y en su propio paso.
      #
      # **Esto no arregla el crash de Xcode 26.3** —lo probamos y crashea igual, solo que
      # en este paso en vez del de al lado—; eso lo arregla el runner, ver arriba. Queda
      # porque hace otra cosa que sí vale: si la resolución falla —un repo caído, un
      # checksum que no da, una etiqueta que se movió— el error dice eso, en vez de salir
      # como un fallo del build treinta líneas más adelante y con otro nombre.
      - name: Resolver las dependencias de SwiftPM
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Xtal.xcodeproj \
            -scheme Xtal \
            -derivedDataPath build

      - name: Compilar la app
        working-directory: app
        # Se firma **ad-hoc** (`CODE_SIGN_IDENTITY=-`), no con un Developer ID: este
        # repo no tiene certificado de Apple ni forma de guardar uno sin meter un
        # secret. En Apple Silicon un binario sin ninguna firma directamente no corre,
        # así que ad-hoc es el piso, no un lujo.
        #
        # Lo que cuesta: Gatekeeper marca la app al bajarla. El cask le saca la
        # cuarentena en su `postflight` — ver packaging/homebrew/render-cask.sh.
        run: |
          set -euo pipefail
          xcodebuild \
            -project Xtal.xcodeproj \
            -scheme Xtal \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build

      - name: Firmar ad-hoc y verificar
        working-directory: app
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Xtal.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Que la app sea universal de verdad. Si el xcframework algún día deja de
          # traer la slice de Intel, el build sigue andando y la app sale solo ARM:
          # esto lo convierte en un error del CI en vez de en un bug de alguien.
          lipo -info "$APP/Contents/MacOS/Xtal" | tee /dev/stderr | grep -q x86_64
          lipo -info "$APP/Contents/MacOS/Xtal" | grep -q arm64

      - name: Empaquetar
        id: pack
        working-directory: app
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          mkdir -p ../dist
          # `ditto` y no `zip`: es lo que preserva los symlinks y los metadatos de un
          # bundle de macOS. Un `.app` comprimido con `zip` llega roto del otro lado.
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Xtal.app \
            "../dist/Xtal-${VERSION}-macos.zip"
          ls -la ../dist

      - uses: actions/upload-artifact@v5
        with:
          # El prefijo `xtal-` no es decorativo: el job `release` baja los artifacts
          # con `pattern: xtal-*`. Sin él, el zip no llega a la Release.
          name: xtal-app-macos
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3b. ¿Quedó la app de Windows atrás de la de Mac?
  # ---------------------------------------------------------------------------
  #
  # Xtal tiene dos apps de escritorio escritas en lenguajes distintos que se publican con
  # el MISMO número de version. Si la de Windows quedó atrás, el que la instala recibe una
  # app que dice 0.6.0 y no hace lo que la de Mac hace con ese número, y no tiene forma de
  # enterarse. Ya se separaron una vez —25 divergencias, descubiertas mirando un retrato de
  # la pantalla y no leyendo el código— y nada lo impedía.
  #
  # **No frena el release, y es a propósito.** Que la app de Mac se adelante mientras se
  # trabaja está bien: se prueba primero en la máquina que uno tiene adelante. Lo que no
  # puede pasar es que la diferencia sea invisible al publicar. Por eso esto es un informe
  # que va a las notas de la Release, no un portón: un chequeo que frena por una diferencia
  # que ya se conocía se termina salteando siempre.
  #
  # El mapa de qué archivo corresponde a cuál está en `paridad.toml`.
  paridad:
    name: paridad entre las dos apps
    needs: check
    runs-on: ubuntu-latest
    outputs:
      informe: ${{ steps.p.outputs.informe }}
    steps:
      - uses: actions/checkout@v5
        with:
          # El informe compara contra el tag ANTERIOR, así que hace falta la historia
          # entera y los tags. Con el checkout de un solo commit no hay contra qué
          # comparar y el paso se saltea sin decir por qué.
          fetch-depth: 0

      - id: p
        name: Comparar contra el tag anterior
        run: |
          set -euo pipefail
          # El tag anterior a este, por fecha. En el primer release no hay ninguno y no
          # hay nada que comparar: el informe queda vacío y la Release sale igual.
          ANTERIOR="$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          if [ -z "$ANTERIOR" ]; then
            echo "No hay un tag anterior: es el primer release. No hay paridad que medir."
            python3 dev/paridad.py --lista
            echo "informe=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparando $ANTERIOR con ${GITHUB_REF_NAME}"
          python3 dev/paridad.py "$ANTERIOR" "${GITHUB_REF_NAME}" | tee /tmp/paridad.md

          # Si encontró deriva, además queda amarillo en la pestaña Actions: las notas de
          # la Release las lee quien las busca, y el warning lo ve el que publica.
          if grep -q "quedó atrás" /tmp/paridad.md; then
            echo "::warning::La app de Windows quedó atrás de la de Mac. El detalle está en las notas de la Release."
          fi

          # A la salida del job, escapado: un output multilínea necesita delimitador.
          {
            echo "informe<<PARIDAD_EOF"
            cat /tmp/paridad.md
            echo "PARIDAD_EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 4. Publicar la Release
  # ---------------------------------------------------------------------------
  release:
    name: publicar release
    needs: [check, build, app, app-mac, paridad]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Hace falta el repo: los manifiestos los generan scripts de `packaging/`.
      - uses: actions/checkout@v5

      - name: Bajar todos los paquetes
        uses: actions/download-artifact@v5
        with:
          # Los binarios (`xtal-*`) y las dos apps (`xtal-app-windows`,
          # `xtal-app-macos`). `docs-assets` no: ya viaja adentro de cada paquete
          # de la CLI.
          pattern: xtal-*
          path: dist
          merge-multiple: true

      - name: Calcular checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # Un solo archivo con todos los hashes: es lo que verifican install.sh y
          # install.ps1. Van los instaladores de la app también — es lo que más se baja
          # a mano desde la página, y es justo donde un archivo cortado pasa inadvertido.
          sha256sum *.tar.gz *.zip *.exe *.msi | tee SHA256SUMS

      # Los manifiestos de los dos gestores de paquetes de Windows, con los hashes de
      # esta Release ya calculados. Se suben como assets para que publicarlos sea copiar
      # un archivo y no volver a generarlo a mano.
      #
      # **No se publican solos**, por la misma razón que el tap de Homebrew no se
      # actualiza desde acá: haría falta guardar un token con permiso de escritura sobre
      # otro repo en los secrets de un repo público. Ver docs/RELEASING.md.
      #   - scoop  → el repo del bucket los regenera solo, leyendo el SHA256SUMS.
      #   - winget → es el repo de Microsoft y se publica por pull request:
      #              `wingetcreate submit --token <TOKEN> <carpeta>`.
      - name: Armar los manifiestos de scoop y winget
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          mkdir -p paquetes/winget
          ./packaging/scoop/render-manifest.sh "$VERSION" dist > paquetes/xtal.json
          ./packaging/winget/render-manifests.sh "$VERSION" dist/SHA256SUMS paquetes/winget
          # Un tar y no cuatro assets sueltos: son archivos de una pieza, se bajan juntos.
          tar -czf dist/manifiestos-${VERSION}.tar.gz -C paquetes .
          ls -la paquetes paquetes/winget

      - name: Crear la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Xtal v${{ needs.check.outputs.version }}
          # `body` va ARRIBA de las notas que GitHub genera solo (los commits y los PRs),
          # no en lugar de ellas. Acá va el informe de paridad: si la app de Windows quedó
          # atrás, se lee en la misma página desde donde se baja.
          body: ${{ needs.paridad.outputs.informe }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS
