# Release de Xtal: compila el binario para cada plataforma, arma los tarballs y
# publica la GitHub Release.
#
# Se dispara al pushear un tag `vX.Y.Z`. El flujo completo es:
#
#   1. `check`  — el tag y la version de Cargo.toml tienen que coincidir.
#   2. `assets` — genera los completions y las man pages UNA vez. No dependen de la
#                 plataforma, y generarlos acá evita tener que ejecutar un binario
#                 cross-compilado (ver el job `build`).
#   3. `build`  — matriz de 4 targets. Cada job produce
#                 `xtal-<version>-<target>.tar.gz` con el binario, los assets y la doc.
#   4. `release`— junta todos los tarballs, calcula SHA256SUMS y crea la Release.
#
# El paquete de Homebrew NO se actualiza desde acá: el repo del tap
# (mcorcos/homebrew-xtal) mira esta Release por su cuenta y regenera su fórmula. Así no
# hace falta guardar un token con permiso de escritura sobre otro repo en los secrets de
# este. Ver docs/RELEASING.md.
#
# Todo lo que el instalador `install.sh` espera encontrar (nombres de los assets y el
# archivo SHA256SUMS) se define acá: si cambia un nombre, hay que cambiarlo en los dos lados.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Permite ensayar el build sin publicar nada (útil para probar la matriz).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compilar y empaquetar sin crear la Release"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # necesario para crear la Release y subir los assets

jobs:
  # ---------------------------------------------------------------------------
  # 1. Coherencia entre el tag y la version del workspace
  # ---------------------------------------------------------------------------
  check:
    name: verificar version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        name: Extraer y comparar versiones
        run: |
          set -euo pipefail
          # En workflow_dispatch no hay tag: usamos la version de Cargo.toml tal cual.
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::El tag es v$TAG_VERSION pero Cargo.toml dice $CARGO_VERSION. Sincronizalos antes de taggear."
              exit 1
            fi
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 2. Completions y man pages, una sola vez
  # ---------------------------------------------------------------------------
  # Los genera el binario a partir de su propia definición de comandos, así que son
  # idénticos en las cuatro plataformas. Hacerlos acá, en un build nativo, evita que
  # los jobs de `build` tengan que EJECUTAR el binario que acaban de compilar: el de
  # Mac Intel se cross-compila desde un runner ARM y no se puede correr ahí.
  assets:
    name: completions + man page
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2

      - name: Generar
        run: |
          set -euo pipefail
          # Build de debug a propósito: es más rápido y el output es el mismo.
          cargo build --bin xtal
          mkdir -p assets/completions assets/man
          target/debug/xtal completions zsh  --out assets/completions
          target/debug/xtal completions bash --out assets/completions
          target/debug/xtal completions fish --out assets/completions
          target/debug/xtal man --out assets/man

      - uses: actions/upload-artifact@v4
        with:
          name: docs-assets
          path: assets
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Compilar y empaquetar, un job por plataforma
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.target }}
    needs: [check, assets]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Macs con Apple Silicon (M1 en adelante) — el caso principal de Manu.
          - target: aarch64-apple-darwin
            os: macos-14
          # Macs Intel. Se CROSS-COMPILA desde el runner ARM: los runners `macos-13`
          # fueron retirados por GitHub y un job que los pida queda encolado para
          # siempre. El clang de Apple compila x86_64 desde arm64 sin configurar nada,
          # así que alcanza con pedirle el target a rustup.
          - target: x86_64-apple-darwin
            os: macos-14
          # Linux x86_64. Runner viejo a propósito: linkea contra una glibc vieja,
          # así el binario anda también en distros no tan nuevas.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Linux ARM (runner nativo, gratis en repos publicos: no hace falta cross).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compilar en modo release
        run: cargo build --release --bin xtal --target ${{ matrix.target }}

      - name: Bajar los completions y la man page
        uses: actions/download-artifact@v4
        with:
          name: docs-assets
          path: assets

      - name: Armar el tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          TARGET="${{ matrix.target }}"
          NAME="xtal-${VERSION}-${TARGET}"
          BIN="target/${TARGET}/release/xtal"

          # El tarball se descomprime en una carpeta con su propio nombre (nunca
          # desparrama archivos en el cwd del usuario).
          mkdir -p "dist/${NAME}"
          cp "$BIN" "dist/${NAME}/xtal"
          cp README.md LICENSE SKILL.md "dist/${NAME}/"
          # Los completions y la man page vienen del job `assets`, generados por el
          # binario a partir de la misma definición de comandos que los flags reales.
          cp -R assets/completions assets/man "dist/${NAME}/"

          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Subir el tarball como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Publicar la Release
  # ---------------------------------------------------------------------------
  release:
    name: publicar release
    needs: [check, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Bajar todos los tarballs
        uses: actions/download-artifact@v4
        with:
          # Solo los tarballs: `docs-assets` ya viaja adentro de cada uno.
          pattern: xtal-*
          path: dist
          merge-multiple: true

      - name: Calcular checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # Un solo archivo con todos los hashes: es lo que verifica install.sh.
          sha256sum *.tar.gz | tee SHA256SUMS

      - name: Crear la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Xtal v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
