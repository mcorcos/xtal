# CI de Xtal: formato, lints y tests en cada push a main y en cada PR.
#
# Es la red de seguridad del release: el workflow de release NO vuelve a correr los
# tests, confía en que main está verde. Corre en Linux y macOS porque el binario se
# distribuye para las dos plataformas y hay código con `#[cfg(target_os = ...)]`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Los tests no deberían necesitar red; si algo la necesita, que falle rápido.
  RUST_BACKTRACE: 1

# Si se pushea dos veces seguidas a la misma rama, cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formato y lints: una sola vez, en Linux. Son independientes de la plataforma.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # -D warnings: cualquier warning de clippy rompe el build. El repo ya está limpio.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # El informe de paridad entre las dos apps de escritorio NO frena un merge: que la
      # de Mac se adelante mientras se trabaja está bien, y ese informe corre en el
      # release (job `paridad` de release.yml).
      #
      # Lo que SÍ frena un merge es que el mapa apunte a un archivo que no existe. Si
      # alguien renombra o mueve un archivo y no toca `paridad.toml`, ese par deja de
      # vigilar y **se ve exactamente igual que uno que funciona**. Es el mismo criterio
      # que el de un logo declarado que no está en el theme: lo que no se declara no se
      # busca, lo que se declara tiene que existir.
      - name: el mapa de paridad apunta a archivos que existen
        run: python3 dev/paridad.py --lista

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Que un SO falle no cancela al otro: queremos ver los dos resultados.
      fail-fast: false
      matrix:
        # Windows entró cuando entró la app: hay código con `#[cfg(windows)]` —el
        # `cmd /c start` de `xtal app` y de `open_file`, las rutas del registro del
        # MCP— y la única forma de saber que no se pudrió es compilarlo ahí.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-features

  # Chequeo de que el binario efectivamente arranca y que los generadores andan.
  # Barato, y atrapa el caso "compila pero explota al primer comando".
  smoke:
    name: smoke test del binario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2

      - name: Compilar el binario
        run: cargo build --bin xtal

      - name: Correr comandos que no tocan el sistema
        run: |
          set -euxo pipefail
          BIN=target/debug/xtal
          "$BIN" --version
          "$BIN" --help > /dev/null
          "$BIN" doctor
          "$BIN" --json doctor | grep -q '"can_build"'
          # El bloque de integración con IA: es lo que mira un agente para darse
          # cuenta solo de que Xtal no está enchufado a su cliente.
          "$BIN" --json doctor | grep -q '"skill"'
          # El ejemplo embebido: que se materialice y que sea un proyecto de verdad.
          "$BIN" example ci-ejemplo > /dev/null
          test -f ci-ejemplo/xtal.toml
          "$BIN" --project ci-ejemplo export > /dev/null
          rm -rf ci-ejemplo
          "$BIN" completions zsh > /dev/null
          "$BIN" completions bash > /dev/null
          "$BIN" completions fish > /dev/null
          "$BIN" man > /dev/null
          # El MCP server: handshake mínimo por stdio. Los tests de integración lo
          # cubren en serio; esto atrapa el caso "el binario ni arranca en modo mcp".
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            | "$BIN" mcp | grep -q '"serverInfo"'
          "$BIN" mcp install --client codex --print > /dev/null

  # La separación núcleo / addon de electrónica, verificada por un build.
  #
  # Xtal hace dos cosas: armar un informe en LaTeX (todo el mundo) y conseguir datos
  # de un circuito (algunos). La segunda vive detrás de la feature `electronics`.
  # Sin un build que la deje afuera, la frontera se pudre sola: alguien usa `xtal_sim`
  # desde el núcleo, compila, y nadie se entera. Es lo mismo que pasó con el theme de
  # ITBA hasta que hubo un segundo theme.
  #
  # Este job es barato y es el que mantiene honesta la arquitectura.
  nucleo:
    name: el núcleo compila sin el addon de electrónica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2

      - name: Compilar y lintear sin `electronics`
        run: |
          set -euxo pipefail
          cargo build --bin xtal --no-default-features
          cargo clippy -p xtal-cli --no-default-features --all-targets -- -D warnings
          cargo test -p xtal-cli --no-default-features

      - name: Y que el binario resultante siga sirviendo para algo
        run: |
          set -euxo pipefail
          BIN=target/debug/xtal
          "$BIN" --version
          # Los comandos de electrónica NO tienen que estar...
          ! "$BIN" --help | grep -qE '^  (sim|circuit|raw) '
          # ...y los del informe sí.
          "$BIN" --help | grep -q '^  plot '
          "$BIN" --help | grep -q '^  run '
          "$BIN" example nucleo-demo > /dev/null
          "$BIN" --project nucleo-demo export > /dev/null
          rm -rf nucleo-demo

  # El único job que compila un PDF de verdad. Sin esto, romper una plantilla de
  # `xtal-render` —un \usepackage mal, una llave de más en el .j2— pasa todos los
  # tests y se descubre recién cuando no compila el TP.
  #
  # Corre en las dos plataformas: Linux es donde vive el CI, pero macOS es donde
  # está el 100% del uso real.
  pdf:
    name: compilar un PDF de verdad (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tectonic_target: x86_64-unknown-linux-gnu
            tectonic_cache: ~/.cache/Tectonic
          - os: macos-latest
            tectonic_target: aarch64-apple-darwin
            tectonic_cache: ~/Library/Caches/Tectonic
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2

      # Tectonic no está en apt (ver `tectonic_pkgs()` en deps.rs), así que se baja
      # el binario de su release. La version va pinneada a propósito: que Tectonic
      # saque una version nueva no tiene por qué romper el CI de Xtal un martes.
      - name: Instalar Tectonic
        env:
          TECTONIC_VERSION: 0.17.0
          TECTONIC_TARGET: ${{ matrix.tectonic_target }}
        run: |
          set -euxo pipefail
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic@${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-${TECTONIC_TARGET}.tar.gz"
          curl -fsSL "$url" -o tectonic.tar.gz
          tar -xzf tectonic.tar.gz
          sudo install -m 0755 tectonic /usr/local/bin/tectonic
          rm -f tectonic tectonic.tar.gz
          tectonic --version

      # Tectonic baja los paquetes de LaTeX de internet en la primera corrida y tarda
      # varios minutos. Sin este cache, cada CI los vuelve a bajar.
      - name: Cachear los paquetes de LaTeX de Tectonic
        uses: actions/cache@v4
        with:
          path: ${{ matrix.tectonic_cache }}
          key: tectonic-bundle-${{ matrix.os }}-v1

      - name: Compilar el binario
        run: cargo build --bin xtal

      # El ejemplo embebido es el mismo que recibe cualquiera que instale Xtal:
      # carátula ITBA + Bode con las tres fuentes. Si esto no compila, el producto
      # está roto para el primer minuto de todo el mundo.
      - name: Compilar el PDF del ejemplo
        run: |
          set -euxo pipefail
          BIN=target/debug/xtal
          "$BIN" example ci-demo
          "$BIN" --project ci-demo run

      # Que el archivo exista no alcanza: un PDF vacío o truncado también existe.
      # 10 KB es un piso holgado — el ejemplo real pesa bastante más.
      - name: Verificar que el PDF es un PDF y no está vacío
        run: |
          set -euxo pipefail
          pdf=ci-demo/salida/main.pdf
          test -f "$pdf"
          head -c 5 "$pdf" | grep -q '%PDF-'
          size=$(wc -c < "$pdf")
          echo "El PDF pesa $size bytes."
          test "$size" -gt 10240

      # Si falla, poder abrir el PDF (o el .log de LaTeX) vale más que leer el stdout.
      - name: Guardar la salida para poder mirarla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.os }}
          path: ci-demo/salida/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # El instalador de Windows, al menos, parsea
  # ---------------------------------------------------------------------------
  #
  # `install.ps1` no lo corre nadie hasta que alguien instala Xtal en Windows, y para
  # entonces un error de sintaxis ya arruinó la primera impresión. Esto es lo mínimo:
  # que PowerShell lo pueda leer. No prueba que la instalación funcione — eso necesita
  # una máquina de verdad y un release publicado.
  instalador:
    name: install.ps1 parsea
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parsear con PowerShell
        shell: pwsh
        run: |
          $errores = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errores) | Out-Null
          if ($errores.Count -gt 0) {
            $errores | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parsea sin errores ($($tokens.Count) tokens)"

      - name: Y el .sh sigue siendo POSIX
        shell: bash
        # El instalador de Unix está escrito en sh POSIX a propósito (macOS trae bash 3.2
        # en modo POSIX, y muchos Linux usan dash). `sh -n` lo verifica sin ejecutarlo.
        run: sh -n install.sh && echo "install.sh parsea"

  # ---------------------------------------------------------------------------
  # La app de escritorio
  # ---------------------------------------------------------------------------
  #
  # Es su propio workspace de Cargo y su propio proyecto de npm, así que el `cargo test
  # --workspace` de arriba no la toca. Se compila en Windows porque es su plataforma: el
  # webview es WebView2 y el instalador lo arma NSIS, y ninguna de las dos cosas existe
  # en Linux.
  #
  # **No se arma el instalador acá**: eso tarda varios minutos y es trabajo del release.
  # Lo que sí se hace es todo lo que puede romperse sin que nadie se entere — que el
  # TypeScript tipe, que el bundle se arme, que el Rust compile y que sus tests pasen.
  #
  # **Corre en los dos sistemas, y no es por las dudas.** `app-win/` es el backend de la
  # app de Windows **y el de la de Linux** —es el mismo Tauri—, y cada uno compila código
  # que el otro ni mira: `#[cfg(windows)]` de un lado, `#[cfg(target_os = "linux")]` del
  # otro. Con un solo runner, la mitad del archivo se publica sin que nadie la haya
  # compilado nunca.
  app:
    name: app de escritorio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri en Linux dibuja con **WebKitGTK**, no con WebView2, y eso no viene en el
      # runner. Sin estos paquetes el build muere en `pkg-config` con un error que habla
      # de `javascriptcoregtk-4.1` y no de que falta una librería del sistema.
      #
      # Es la misma lista que necesita cualquiera que quiera compilar la app en Linux:
      # está copiada en `docs/APP-LINUX.md` para que no haya que leer un workflow.
      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf xdg-utils

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-win/src-tauri
          key: app-ci-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-win/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: app-win
        run: npm ci

      # `npm run build` corre `tsc --noEmit` primero: si un tipo no cierra, no llega a
      # empaquetar. Es lo que atrapa el 90% de lo que se rompe tocando el frontend.
      #
      # Solo en uno: el frontend es el mismo archivo y el mismo `tsc` en los dos, así que
      # correrlo dos veces no puede encontrar nada nuevo.
      - name: Tipos y bundle
        if: runner.os == 'Windows'
        working-directory: app-win
        run: npm run build

      # En Linux igual hay que dejar el `dist/`: `tauri` no compila si no existe el
      # frontend que va a empaquetar, aunque solo se le pida `clippy`.
      - name: Bundle del frontend (Linux)
        if: runner.os == 'Linux'
        working-directory: app-win
        run: npm run build

      # `fmt` mira el archivo entero sin importar el `cfg`, así que con un runner alcanza.
      # `clippy` no: compila lo que el `cfg` deja pasar, y por eso corre en los dos.
      - name: fmt del backend
        if: runner.os == 'Windows'
        working-directory: app-win/src-tauri
        run: cargo fmt --all -- --check

      - name: clippy del backend
        working-directory: app-win/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: tests del backend
        working-directory: app-win/src-tauri
        run: cargo test

  # ---------------------------------------------------------------------------
  # El instalador de Windows se arma de verdad
  # ---------------------------------------------------------------------------
  #
  # Es el mismo argumento que el job `pdf`: **era el único agujero que podía romper el
  # producto sin que nadie se entere.** El job `app` compila el Rust y el TypeScript,
  # pero armar el `.exe` de NSIS es otro paso —baja el plugin de NSIS, arma el MSI con
  # WiX, empaqueta los recursos— y cualquiera de esas cosas puede fallar con todo lo
  # demás en verde.
  #
  # Tarda unos minutos y corre en cada push. Vale la pena: hoy **nadie lo instaló nunca**,
  # y un instalador que no se arma es un producto que no existe.
  #
  # Sube el resultado como artifact, así se puede bajar y probar en una máquina con
  # Windows sin tener que publicar una Release.
  instalable:
    name: el instalador se arma
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app-win/src-tauri
          key: instalador

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-win/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: app-win
        run: npm ci

      # La CLI viaja adentro del instalador: es lo que hace que bajar el `.exe` alcance.
      # Ver app-win/src-tauri/resources/LEEME.md.
      - name: Compilar la CLI y meterla adentro
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin xtal
          cp target/release/xtal.exe app-win/src-tauri/resources/xtal.exe

      - name: Armar el instalador
        working-directory: app-win
        run: npm run tauri build

      # Que los archivos existan no alcanza: un instalador truncado también existe.
      - name: Verificar que salieron los dos y que pesan
        shell: bash
        run: |
          set -euo pipefail
          OUT=app-win/src-tauri/target/release/bundle
          for patron in "$OUT/nsis/*-setup.exe" "$OUT/msi/*.msi"; do
            archivo=$(ls $patron 2>/dev/null | head -1)
            if [ -z "$archivo" ]; then
              echo "::error::no se armó $patron"
              exit 1
            fi
            tam=$(stat -c%s "$archivo" 2>/dev/null || stat -f%z "$archivo")
            echo "$archivo — $((tam/1024)) KB"
            # Menos de 2 MB es imposible: adentro va el webview, el frontend y la CLI.
            if [ "$tam" -lt 2000000 ]; then
              echo "::error::$archivo pesa $((tam/1024)) KB, quedó cortado"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v5
        with:
          name: instalador-windows
          path: |
            app-win/src-tauri/target/release/bundle/nsis/*-setup.exe
            app-win/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Y los paquetes de Linux también
  # ---------------------------------------------------------------------------
  #
  # Mismo argumento que el job de arriba, y **no es hipotético**: la primera vez que se
  # armaron de verdad, el `.deb` y el `.rpm` salieron bien y **el AppImage murió al final**
  # con «xdg-mime binary not found». Faltaba `xdg-utils`, que el bundler necesita porque la
  # app declara el esquema `xtal://`. Todo lo demás —compilar, tipar, los tests— estaba en
  # verde. Sin este job, eso se descubre al taggear.
  #
  # Y el AppImage es el que usa `install.sh`, así que se verifica además que **se pueda
  # desempaquetar** y que su `.desktop` declare el esquema: si eso se cae, el agente pierde
  # el manejo de la app y nada más lo delata.
  paquetes-linux:
    name: los paquetes de Linux se arman
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf rpm desktop-file-utils xdg-utils

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app-win/src-tauri
          key: paquetes-linux

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-win/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: app-win
        run: npm ci

      # La CLI viaja adentro del paquete, igual que en Windows: es lo que hace que bajar
      # el `.deb` alcance. Ver app-win/src-tauri/resources/LEEME.md.
      - name: Compilar la CLI y meterla adentro
        run: |
          set -euo pipefail
          cargo build --release --bin xtal
          cp target/release/xtal app-win/src-tauri/resources/xtal
          chmod +x app-win/src-tauri/resources/xtal

      - name: Armar los tres paquetes
        working-directory: app-win
        run: npm run tauri build

      - name: Verificar que sirven, no que existen
        run: |
          set -euo pipefail
          OUT=app-win/src-tauri/target/release/bundle
          for patron in "$OUT/deb/*.deb" "$OUT/rpm/*.rpm" "$OUT/appimage/*.AppImage"; do
            archivo=$(ls $patron 2>/dev/null | head -1)
            [ -n "$archivo" ] || { echo "::error::no se armó $patron"; exit 1; }
            tam=$(stat -c%s "$archivo")
            echo "$archivo — $((tam/1024/1024)) MB"
            [ "$tam" -gt 1000000 ] || { echo "::error::$archivo pesa $((tam/1024)) KB, quedó cortado"; exit 1; }
          done

          # El `.deb` tiene que traer la CLI donde `bundled()` la busca, que NO es al lado
          # del ejecutable como en Windows: es `usr/lib/<producto>/resources/`. Si Tauri
          # cambiara ese lugar, la app diría que no encuentra `xtal` en una máquina donde
          # el archivo sí está — un error imposible de entender desde afuera.
          echo "--- la CLI adentro del .deb:"
          dpkg-deb -c "$OUT"/deb/*.deb | grep -E "resources/xtal$" \
            || { echo "::error::el .deb no trae la CLI en usr/lib/<producto>/resources/."; exit 1; }

          # Y el AppImage, que es el que usa `install.sh`: se desempaqueta sin FUSE y su
          # `.desktop` enruta `xtal://`.
          cd "$OUT/appimage"
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun || { echo "::error::el AppImage no trae AppRun."; exit 1; }
          find squashfs-root -name xtal -type f | grep -q . \
            || { echo "::error::el AppImage no trae la CLI adentro."; exit 1; }
          grep -rq 'x-scheme-handler/xtal' squashfs-root --include='*.desktop' \
            || { echo "::error::el .desktop no declara x-scheme-handler/xtal: xtal:// no va a andar."; exit 1; }
          desktop-file-validate squashfs-root/*.desktop
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v5
        with:
          name: paquetes-linux
          path: |
            app-win/src-tauri/target/release/bundle/deb/*.deb
            app-win/src-tauri/target/release/bundle/rpm/*.rpm
            app-win/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error
