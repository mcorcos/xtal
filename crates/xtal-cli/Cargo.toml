# xtal-cli — el binario `xtal`. Define toda la superficie de comandos con clap
# (cada flag exhaustivamente documentada, pensada para que la maneje una IA) y
# orquesta las librerías del núcleo. Acá vive la salida humana y la --json.
[package]
name = "xtal-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# El binario se llama `xtal` aunque el crate se llame `xtal-cli`.
[[bin]]
name = "xtal"
path = "src/main.rs"

# El addon de electrónica: circuitos, ngspice y rawfiles. Prendido por default —
# es lo que Xtal es hoy — pero se puede apagar, y entonces el binario no lleva nada
# del simulador. Que exista un build sin esto es lo que mantiene honesta la
# separación entre "armar un informe" (todo el mundo) y "medir un circuito"
# (algunos). Ver el doc de `src/electronics.rs`.
[features]
default = ["electronics"]
electronics = ["dep:xtal-sim"]

[dependencies]
xtal-model = { workspace = true }
xtal-config = { workspace = true }
xtal-data = { workspace = true }
xtal-sim = { workspace = true, optional = true }
xtal-render = { workspace = true }
xtal-compile = { workspace = true }
clap = { workspace = true }
# Generadores de autocompletado y man page (`xtal completions`, `xtal man`).
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# `xtal mcp install --client codex` edita ~/.codex/config.toml preservando comentarios.
toml_edit = { workspace = true }
indexmap = { workspace = true }
# Rutas de config por plataforma (dónde guarda su config cada cliente MCP).
directories = { workspace = true }
# El proyecto de ejemplo va embebido en el binario (`xtal example`), como los themes.
rust-embed = { workspace = true }
# Instalador interactivo (`xtal setup`).
dialoguer = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
