# Autocomplete: el modelo que corre adentro de la máquina
# ---------------------------------------------------------------------------
#
# Las dos apps hacen lo mismo con **motores distintos**, y esa es la única parte del
# producto donde el motor no se comparte:
#
#   Mac      MLX (`mlx-swift-lm`), in-process, pesos en `.safetensors`
#   Windows  llama.cpp, en un subproceso, el mismo modelo en `.gguf`
#
# MLX es de Apple y aprovecha la memoria unificada de Apple Silicon; en Windows no
# existe. El modelo es el mismo —Qwen2.5-Coder 1.5B, cuantizado a 4 bits— y las
# decisiones de producto son las mismas, que es lo que estos pares vigilan.

[[par]]
mac = "app/XtalPackage/Sources/XtalFeature/Autocomplete/Autocomplete.swift"
win = ["app-win/src/editor/autocomplete.ts"]
por_que = "el control del autocomplete: prender, apagar, pedir la sugerencia y aceptarla. Acá vive la promesa de que apagado no carga nada"

[[par]]
mac = "app/XtalPackage/Sources/XtalFeature/Autocomplete/ModeloLocal.swift"
win = ["app-win/src-tauri/src/modelo.rs"]
por_que = "dónde vive el modelo, si está entero y cuánto ocupa"

[[par]]
mac = "app/XtalPackage/Sources/XtalFeature/Autocomplete/DescargaModelo.swift"
win = ["app-win/src-tauri/src/modelo.rs"]
por_que = "la bajada de los ~876 MB, con progreso de verdad y con cancelar"

[[par]]
