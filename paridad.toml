# Qué archivo de la app de Mac se corresponde con cuál de la app de Windows.
#
# ## Para qué existe
#
# Xtal tiene DOS apps de escritorio, escritas en lenguajes distintos, que tienen que
# comportarse igual: `app/` en Swift y `app-win/` en Rust + TypeScript. Ya pasó una vez
# que se separaron —la primera version de la de Windows salió con 25 divergencias, y se
# descubrió mirando un retrato de la pantalla, no leyendo el código—, y nada impedía que
# volviera a pasar.
#
# Este archivo es lo que hace que se pueda detectar solo.
#
# ## Qué NO hace
#
# **No bloquea un merge.** Que la app de Mac se adelante mientras se trabaja es normal y
# está bien: se prueba primero en la máquina que uno tiene adelante. Un chequeo que
# frenara cada PR obligaría a portar todo en el momento, y eso termina en dos ports a
# medias en vez de uno bueno.
#
# Lo que sí importa es **qué se publica**: una Release es lo que la gente baja, y ahí las
# dos apps salen con el mismo número de version. Si la de Windows quedó atrás, el usuario
# de Windows recibe una app que dice 0.6.0 y no hace lo que la de Mac hace con ese mismo
# número — y no tiene forma de saberlo.
#
# Por eso el chequeo corre **en el release**, compara contra el tag anterior, y lo que
# encuentra va anotado en las notas de la Release. Ver `dev/paridad.py` y el job
# `paridad` de `.github/workflows/release.yml`.
#
# ## Cómo se lee cada entrada
#
#   mac      = el archivo de la app de Swift
#   win      = uno o más archivos de la app de Windows que hacen lo mismo
#   por_que  = qué es esa pieza, en una línea
#
#   pendiente = por qué todavía no hay contraparte (solo cuando `win` está vacío)
#
# Un archivo que todavía no tiene contraparte va con `win = []` y un `pendiente` que
# explica qué falta. Eso no es una omisión: es una diferencia conocida y anotada, y
# aparece en el informe de **cada** release hasta que alguien la cierre. Es a propósito:
# una deuda que deja de verse deja de existir.

